id           = "heprado/monitor-settings"
name         = "Monitor Settings (DDC/CI)"
version      = "1.1.0"
plugin_api   = 24
author       = "heprado"
license      = "MIT"
icon         = "device-desktop"
description  = "Display arrangement (drag-and-drop canvas, resolution, refresh rate, rotation, scale/DPI, adaptive sync) plus full DDC/CI monitor controls (brightness, contrast, RGB gain, input source, and every other VCP feature ddcutil exposes)."
dependencies = ["ddcutil", "wlr-randr"]
tags         = ["hardware", "monitor", "display", "ddcutil", "wlr-randr"]

[[service]]
id    = "service"
entry = "service.luau"

[[widget]]
id    = "widget"
entry = "widget.luau"

[[launcher_provider]]
id                       = "launcher"
entry                    = "launcher.luau"
prefix                   = "monitor"
glyph                    = "device-desktop"
include_in_global_search = true

[[panel]]
id              = "panel"
entry           = "panel.luau"
width           = 720
height          = 820
placement       = "floating"
position        = "center"
open_near_click = false
