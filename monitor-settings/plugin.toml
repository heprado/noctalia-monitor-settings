id           = "heprado/monitor-settings"
name         = "Monitor Settings (DDC/CI)"
version      = "2.0.0"
plugin_api   = 24
author       = "heprado"
license      = "MIT"
icon         = "device-desktop"
description  = "A Quickshell app for display arrangement (drag-and-drop canvas, resolution, refresh rate, rotation, scale/DPI, adaptive sync) and full DDC/CI monitor controls, themed by the active Qt theme."
dependencies = ["quickshell", "ddcutil", "wlr-randr"]
tags         = ["hardware", "monitor", "display", "ddcutil", "wlr-randr", "quickshell"]

[[service]]
id    = "service"
entry = "service.luau"

[[widget]]
id    = "widget"
entry = "widget.luau"

[[launcher_provider]]
id                       = "launcher"
entry                    = "launcher.luau"
prefix                   = "monitor"
glyph                    = "device-desktop"
include_in_global_search = true
