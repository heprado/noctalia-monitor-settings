id           = "heprado/monitor-controls"
name         = "Monitor Controls (DDC/CI)"
version      = "1.0.0"
plugin_api   = 9
author       = "heprado"
license      = "MIT"
icon         = "device-desktop"
description  = "Full DDC/CI monitor controls (brightness, contrast, RGB gain, input source, and every other VCP feature ddcutil exposes), grouped by category, per connected monitor."
dependencies = ["ddcutil", "wlr-randr"]
tags         = ["hardware", "monitor", "display", "ddcutil"]

[[service]]
id    = "service"
entry = "service.luau"

[[widget]]
id    = "widget"
entry = "widget.luau"

[[launcher_provider]]
id                       = "launcher"
entry                    = "launcher.luau"
prefix                   = "monitor"
glyph                    = "device-desktop"
include_in_global_search = true

[[panel]]
id              = "panel"
entry           = "panel.luau"
width           = 560
height          = 680
placement       = "floating"
position        = "center"
open_near_click = false
